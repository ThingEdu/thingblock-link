[package]
name = "thingblock-link"
version = "0.2.0"
edition = "2024"

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"

[dev-dependencies]
tokio-tungstenite = "0.29"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
btleplug = "0.11"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.35"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tonic = "0.14"
tonic-prost = "0.14"
tower-http = { version = "0.6", features = ["cors", "fs", "limit", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tray-icon = "0.24"
uuid = "1"
wry = "0.55"
